name: DV2 live browser visual audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "charts/**"
      - ".github/workflows/dv2-live-audit.yml"
      - "scripts/dv2-browser-audit.mjs"
      - "scripts/dv2-mobile-type-audit.mjs"
      - "scripts/dv2-data-integrity.mjs"
      - "scripts/dv2-semantic-encoding-audit.mjs"

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify consistency of 14 chart datasets
        run: node scripts/dv2-data-integrity.mjs
      - name: Validate semantic colours, scales and chapter consistency
        run: node scripts/dv2-semantic-encoding-audit.mjs
      - name: Install Playwright and browser
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Wait for this commit's GitHub Pages HTML
        run: |
          set -euo pipefail
          LOCAL_SHA=$(sha256sum index.html | cut -d' ' -f1)
          for attempt in $(seq 1 36); do
            if curl --silent --show-error --fail --max-time 12 \
              -H 'Cache-Control: no-cache' \
              "https://vinceyuchen.github.io/animal-shelter-dv2/?audit_rev=${GITHUB_SHA}&attempt=${attempt}" \
              -o /tmp/dv2-online.html; then
              REMOTE_SHA=$(sha256sum /tmp/dv2-online.html | cut -d' ' -f1)
              if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
                echo "Published HTML matches the commit under test."
                exit 0
              fi
            fi
            echo "Waiting for the current GitHub Pages deployment, attempt $attempt/36."
            sleep 5
          done
          echo "GitHub Pages did not publish this commit's HTML; inspection was not run against a stale version." >&2
          exit 1
      - name: Verify published chart assets match this commit
        run: |
          set -euo pipefail
          base="https://vinceyuchen.github.io/animal-shelter-dv2"
          files=(
            "js/embed.js"
            "css/style.css"
            "charts/chart5_compare.vg.json"
            "charts/chart11_foster_lollipop.vg.json"
            "charts/chart9_yoy_bump.vg.json"
            "charts/chart14_foster_treemap.vg.json"
            "charts/chart11_foster_lollipop.vg.json"
            "charts/chart10_outcome_sankey.vg.json"
            "charts/chart12_cat_share_slope.vg.json"
            "charts/map_live_release.vg.json"
            "charts/map_rspca_locations.vg.json"
            "charts/chart13_townsville_seasonality.vg.json"
            "charts/chart7_outcome_heatmap.vg.json"
            "charts/map_caseload_symbols.vg.json"
          )
          for attempt in $(seq 1 36); do
            fresh=1
            for file in "${files[@]}"; do
              remote="/tmp/dv2-${file//\//_}"
              if ! curl --silent --show-error --fail --max-time 12 \
                  -H 'Cache-Control: no-cache' \
                  "${base}/${file}?audit_sha=${GITHUB_SHA}&attempt=${attempt}" \
                  -o "${remote}" || ! cmp -s "${file}" "${remote}"; then
                fresh=0
                echo "Not current yet: ${file} (attempt ${attempt}/36)"
                break
              fi
            done
            if [ "${fresh}" -eq 1 ]; then
              echo "Published JS, CSS and critical chart specifications all match this commit."
              exit 0
            fi
            sleep 5
          done
          echo "At least one published asset was stale; refusing to certify old chart screenshots." >&2
          exit 1
      - name: Inspect the actual published GitHub Pages website
        run: node scripts/dv2-browser-audit.mjs
      - name: Verify narrow-screen typography and scroll regions (768px / 390px)
        run: node scripts/dv2-mobile-type-audit.mjs
      - name: Upload full screenshots, section screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dv2-live-browser-audit
          path: dv2-browser-audit/
          if-no-files-found: warn
          retention-days: 14
